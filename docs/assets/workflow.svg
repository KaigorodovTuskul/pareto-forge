<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="title desc">
<title id="title">Pareto Forge: Useful first, stop early</title>
<desc id="desc">Four lightweight moves: Value, Cut, Ship, Stop. Flash by default, review only when risk warrants it.</desc>
<rect width="1280" height="330" rx="22" fill="#121923"/>
<rect x="1" y="1" width="1278" height="328" rx="21" fill="none" stroke="#344251" stroke-width="2"/>
<text x="55" y="55" font-size="15" font-family="Arial,sans-serif" letter-spacing="3" font-weight="700" fill="#50e4ea">THE 80/20 EXECUTION LOOP</text>
<text x="55" y="98" font-size="28" font-family="Arial,sans-serif" font-weight="700" fill="#f5fafc">Useful first. Stop early.</text>
<g font-family="Arial,sans-serif">
 <rect x="55" y="126" width="267" height="135" rx="14" fill="#1e2935" stroke="#445468"/>
 <text x="80" y="162" font-size="16" font-weight="700" fill="#50e4ea">01</text>
 <text x="80" y="201" font-size="26" font-weight="700" fill="white">VALUE</text>
 <text x="80" y="229" font-size="16" fill="#c0cfdd">What must work now?</text>
 <path d="M328 192 H343 M337 186 L344 192 L337 198" fill="none" stroke="#50e4ea" stroke-width="3"/>
 <rect x="354" y="126" width="267" height="135" rx="14" fill="#1e2935" stroke="#445468"/>
 <text x="379" y="162" font-size="16" font-weight="700" fill="#50e4ea">02</text>
 <text x="379" y="201" font-size="26" font-weight="700" fill="white">CUT</text>
 <text x="379" y="229" font-size="16" fill="#c0cfdd">What can wait?</text>
 <path d="M627 192 H642 M636 186 L643 192 L636 198" fill="none" stroke="#50e4ea" stroke-width="3"/>
 <rect x="653" y="126" width="267" height="135" rx="14" fill="#1e2935" stroke="#445468"/>
 <text x="678" y="162" font-size="16" font-weight="700" fill="#50e4ea">03</text>
 <text x="678" y="201" font-size="26" font-weight="700" fill="white">SHIP</text>
 <text x="678" y="229" font-size="16" fill="#c0cfdd">Deliver a useful slice</text>
 <path d="M926 192 H941 M935 186 L942 192 L935 198" fill="none" stroke="#50e4ea" stroke-width="3"/>
 <rect x="952" y="126" width="273" height="135" rx="14" fill="#163b41" stroke="#50e4ea" stroke-width="2"/>
 <text x="977" y="162" font-size="16" font-weight="700" fill="#50e4ea">04</text>
 <text x="977" y="201" font-size="26" font-weight="700" fill="white">STOP</text>
 <text x="977" y="229" font-size="16" fill="#cde8ea">Good enough? Deliver.</text>
</g>
<text x="55" y="298" font-size="15" font-family="Arial,sans-serif" fill="#a8b9c9">Flash by default · Grill only when necessary · Never silently drop must-haves</text>
</svg>
